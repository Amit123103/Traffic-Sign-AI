services:
  - type: web
    name: traffic-sign-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    envVars:
      - key: DATABASE_URL
        value: sqlite:///traffic_signs.db
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: false
    disk:
      name: traffic-data
      mountPath: /app/static
      sizeGB: 1
