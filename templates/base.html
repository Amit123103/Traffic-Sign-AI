<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrafficSign AI | Cyberpunk TSRS</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="loading-overlay" class="hidden">
        <div class="spinner-container">
            <div class="traffic-spinner">
                <i class="fas fa-traffic-light"></i>
            </div>
            <p>Processing Neural Grid...</p>
        </div>
    </div>

    <aside class="sidebar">
        <div class="logo">
            <i class="fas fa-microchip neon-text"></i>
            <span>TSRS<span class="neon-text">.AI</span></span>
        </div>
        
        <nav class="nav-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">
                <i class="fas fa-th-large"></i> Dashboard
            </a>
            <a href="/detect" class="{% if request.path == '/detect' %}active{% endif %}">
                <i class="fas fa-camera"></i> Image Detection
            </a>
            <a href="/video" class="{% if request.path == '/video' %}active{% endif %}">
                <i class="fas fa-video"></i> Video Analysis
            </a>
            <a href="/webcam" class="{% if request.path == '/webcam' %}active{% endif %}">
                <i class="fas fa-eye"></i> Live Stream
            </a>
            <a href="/analytics" class="{% if request.path == '/analytics' %}active{% endif %}">
                <i class="fas fa-chart-line"></i> Neural Stats
            </a>
            <a href="/admin" class="{% if request.path == '/admin' %}active{% endif %}">
                <i class="fas fa-user-shield"></i> Admin Core
            </a>
        </nav>

        <div class="sidebar-footer">
            <div id="live-clock" class="mono">00:00:00</div>
            <button id="theme-toggle" class="btn-icon">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <div id="toast-container"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
